; ============================================================================
;  AVRO CLASSIC  [+]   -  a dark glass bar with picture buttons that light up
; ============================================================================
;  This is a "[+]" skin: the buttons that have  Action=Ext1 ... Ext3  are the ones YOU set up.
;  Open Settings > TopBar Theme, pick "Avro Classic [+]" as the TopBar style, and under
;  "Extra buttons" tick and set up the buttons (button 1 is always on; an unticked button is
;  left out and the bar closes the gap). Icon "App icon" = the picture of this skin.
;
;  Bar layout (every button cell is 32 px wide and 30 px high):
;    [icon] [mode: English / বাংলা + small arrow] [Ext1] [Ext2] [settings] [Ext3] [about] [close]
;
;  How to change it: see "_Skin Template\skin.ini". Save this file as UTF-8.
;  Everything (size, positions, pictures, actions) is read from this folder; nothing is built into the program.
; ============================================================================

[Skin]
; the name shown in the TopBar style list ("[+]" is added by the program, because this skin has Ext buttons)
Name=Avro Classic
Width=286
Height=30
Background=bar_bg.png
BackColor=1C2535
; 1 = the pictures of the buttons and the name box let the bar picture show through
Transparent=1

[Icon]
; the icon of the current layout; it is also the handle for dragging the bar
Show=1
X=6

[LayoutBox]
; the mode box: English while English is on, the Bangla text while a Bangla layout is on.
; Click it to open the list of layouts (add  Action=Toggle  to switch Bangla on / off instead).
; The small arrow sits right under it.
Show=1
X=30
Y=3
W=60
H=18
; Transparent = no box colour: the bar picture shows behind the text
BackColor=Transparent
TextColor=FFFFFF
Font=Segoe UI
FontSize=8
Bold=1
Align=Center
; Display=Mode shows EnglishText / BanglaText instead of the layout name
Display=Mode
EnglishText=English
BanglaText=বাংলা
Arrow=arrow
ArrowX=55
ArrowY=21
ArrowW=10
ArrowH=6

; ============================================================================
;  BUTTONS   (Image=name  ->  name.png, and name_hover.png while the mouse is over it)
; ============================================================================

[Button1]
; yours: Settings > TopBar Theme > Extra buttons (tray picture)
Action=Ext1
Image=ext1
X=90
Y=0
W=32
H=30

[Button2]
; yours: Settings > TopBar Theme > Extra buttons (pawn picture)
Action=Ext2
Image=ext2
X=122
Y=0
W=32
H=30

[Button3]
Action=Settings
Image=settings
X=154
Y=0
W=32
H=30

[Button4]
; yours: Settings > TopBar Theme > Extra buttons (browser picture)
Action=Ext3
Image=ext3
X=186
Y=0
W=32
H=30

[Button5]
; the About window of Bangla Keyboard
Action=About
Image=about
X=218
Y=0
W=32
H=30

[Button6]
; Close = exit the program (use Action=Minimize to send the bar to the tray instead)
Action=Close
Image=close
X=250
Y=0
W=32
H=30
