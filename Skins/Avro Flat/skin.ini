; ============================================================================
;  AVRO FLAT  [+]   -  a flat dark bar with square buttons that light up blue
; ============================================================================
;  This is a "[+]" skin: the buttons that have  Action=Ext1 / Ext2 / Ext3  are the ones YOU set up.
;  Open Settings > TopBar Theme, pick "Avro Flat [+]" as the TopBar style, and under
;  "Extra buttons" tick and set up the three buttons (button 1 is always on; an unticked
;  button is left out and the bar closes the gap). Icon "App icon" = the picture of this skin.
;
;  Bar layout (every cell is 32 px wide and 32 px high, the mode box is 36 px wide):
;    [icon] [mode] [layouts] [Ext1 keyboard] [Ext2 mouse] [settings] [Ext3 web] [about] [close]
;
;  How to change it: see "_Skin Template\skin.ini". Save this file as UTF-8.
; ============================================================================

[Skin]
; the name shown in the TopBar style list ("[+]" is added by the program, because this skin has Ext buttons)
Name=Avro Flat
Width=292
Height=32
; no picture: the bar is the flat colour below
Background=
BackColor=252525
Transparent=0

[Icon]
; the icon of the current layout; it is also the handle for dragging the bar
Show=1
X=6

[LayoutBox]
; the "mode" box: ENG while English is on, the Bangla text while a Bangla layout is on.
; Clicking it switches between them.
Show=1
X=32
Y=0
W=36
H=32
BackColor=252525
TextColor=FFFFFF
Font=Segoe UI
FontSize=9
Bold=0
Align=Center
; no arrow
Arrow=
; Display=Mode shows ENG / the Bangla text instead of the layout name
Display=Mode
EnglishText=ENG
BanglaText=বাংলা
; what a click on the box does (Toggle = switch Bangla on / off)
Action=Toggle
; the colour of the box (and of every button picture) under the mouse
HoverColor=2773EC

; ============================================================================
;  BUTTONS   (Image=name  ->  name.png, and name_hover.png while the mouse is over it)
; ============================================================================

[Button1]
; opens the list of layouts (right under this button)
Action=LayoutMenu
Image=layouts
X=68
Y=0
W=32
H=32

[Button2]
; yours: Settings > TopBar Theme > Extra buttons (keyboard picture)
Action=Ext1
Image=keyboard
X=100
Y=0
W=32
H=32

[Button3]
; yours: Settings > TopBar Theme > Extra buttons (mouse picture)
Action=Ext2
Image=mouse
X=132
Y=0
W=32
H=32

[Button4]
Action=Settings
Image=settings
X=164
Y=0
W=32
H=32

[Button5]
; yours: Settings > TopBar Theme > Extra buttons (web picture)
Action=Ext3
Image=web
X=196
Y=0
W=32
H=32

[Button6]
Action=About
Image=about
X=228
Y=0
W=32
H=32

[Button7]
Action=Close
Image=close
X=260
Y=0
W=32
H=32
